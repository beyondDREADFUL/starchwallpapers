# Publishes the Starch Wallpapers showcase to GitHub Pages:
# https://beyonddreadful.github.io/starchwallpapers/
#
# The site is built from the `revival` branch (the exam version on `main` and the
# `exam-submission-2025` tag are left as they were). GitHub Pages can't run .NET,
# so tools/build-static-site.sh runs the app once and saves every page as HTML.
# It runs daily so the Bing Image of the Day stays fresh.
#
# Optional repository secret NASA_API_KEY (falls back to NASA's rate-limited DEMO_KEY).
name: Publish showcase to GitHub Pages

on:
  schedule:
    - cron: "15 9 * * *"   # Daily at 09:15 UTC, after Bing's new image (08:00 UTC)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: revival

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build static site
        run: tools/build-static-site.sh _site
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
